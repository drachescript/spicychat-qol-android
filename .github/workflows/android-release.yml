name: Android Stable Release

on:
  push:
    branches:
      - main
    paths:
      - "android_app/pubspec.yaml"
      - ".github/workflows/android-release.yml"
      - "build_android.ps1"
      - "update_android.ps1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out Android repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Android release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $text = Get-Content -LiteralPath "android_app\pubspec.yaml" -Raw
          $m = [regex]::Match(
            $text,
            '(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$'
          )

          if (-not $m.Success) {
            throw "Could not parse version from android_app\pubspec.yaml."
          }

          $version = $m.Groups[1].Value
          $versionCode = $m.Groups[2].Value
          $tag = "v$version"

          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) {
            throw "git fetch --tags failed."
          }

          # git tag --list succeeds even when the tag does not exist.
          # Do NOT use git rev-parse here: a missing tag intentionally returns
          # exit code 1, which caused the previous v0.1.1 workflow to fail.
          $matchingTags = @(git tag --list $tag)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect existing Git tags."
          }
          $tagExists = $matchingTags.Count -gt 0

          # Treat an existing GitHub Release as the completed state. This also
          # lets a rerun recover if a tag was created but release publishing
          # failed afterward.
          $releaseExists = $false
          try {
            gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName *> $null
            $releaseExists = ($LASTEXITCODE -eq 0)
          }
          catch {
            $releaseExists = $false
          }

          # gh returns a non-zero code when no release exists. That is expected.
          # Explicit outputs + exit 0 prevent that probe from failing this step.
          $needsTag = -not $tagExists
          $shouldRelease = -not $releaseExists

          "version=$version" >> $env:GITHUB_OUTPUT
          "version_code=$versionCode" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "needs_tag=$($needsTag.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "pubspec:         $version+$versionCode"
          Write-Host "tag:             $tag"
          Write-Host "tag exists:      $tagExists"
          Write-Host "release exists:  $releaseExists"
          Write-Host "needs tag:       $needsTag"
          Write-Host "should release:  $shouldRelease"

          exit 0

      - name: No new release needed
        if: steps.version.outputs.should_release != 'true'
        shell: pwsh
        run: |
          Write-Host "${{ steps.version.outputs.tag }} already has a published GitHub Release."
          Write-Host "Nothing to build or publish."

      - name: Check out current SpicyChat QoL extension
        if: steps.version.outputs.should_release == 'true'
        uses: actions/checkout@v4
        with:
          repository: drachescript/spicychat-qol-extension
          ref: main
          path: spicychat-qol-extension

      - name: Set up Java 17
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.version.outputs.should_release == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android signing files
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD) -or
            [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS) -or
            [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_PASSWORD)
          ) {
            throw "One or more Android signing secrets are missing."
          }

          $androidDir = Join-Path $env:GITHUB_WORKSPACE "android_app\android"
          $keystorePath = Join-Path $androidDir "upload-keystore.jks"
          $propertiesPath = Join-Path $androidDir "key.properties"

          $base64 = $env:ANDROID_KEYSTORE_BASE64 -replace '\s', ''
          [System.IO.File]::WriteAllBytes(
            $keystorePath,
            [Convert]::FromBase64String($base64)
          )

          @"
          storePassword=$env:ANDROID_KEYSTORE_PASSWORD
          keyPassword=$env:ANDROID_KEY_PASSWORD
          keyAlias=$env:ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          "@ | Set-Content -LiteralPath $propertiesPath -Encoding UTF8

      - name: Build signed Android APK
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          ANDROID_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          $extensionRoot = Join-Path $env:GITHUB_WORKSPACE "spicychat-qol-extension"

          & ".\build_android.ps1" `
            -ExtensionSourceRoot $extensionRoot `
            -NoVersionBump `
            -ExpectedVersion $env:ANDROID_VERSION `
            -ExpectedVersionCode ([int]$env:ANDROID_VERSION_CODE)

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify release files
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          ANDROID_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $required = @(
            "output\SpicyChat-QOL-Android-$env:ANDROID_TAG.apk",
            "output\SpicyChat-QOL-Android-$env:ANDROID_TAG.apk.sha256",
            "output\SHA256SUMS.txt",
            "output\update.json"
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing release output: $path"
            }
          }

      - name: Create release tag on this commit
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.needs_tag == 'true'
        shell: pwsh
        env:
          ANDROID_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a $env:ANDROID_TAG $env:GITHUB_SHA -m "SpicyChat QOL Android $env:ANDROID_TAG"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          git push origin "refs/tags/$env:ANDROID_TAG"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SpicyChat QOL Android ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            output/SpicyChat-QOL-Android-${{ steps.version.outputs.tag }}.apk
            output/SpicyChat-QOL-Android-${{ steps.version.outputs.tag }}.apk.sha256
            output/SHA256SUMS.txt
            output/update.json
            output/current-version.txt
