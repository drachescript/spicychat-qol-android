name: Notify website after Android release

on:
  workflow_run:
    workflows: ["Android Stable Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger website manifest sync
        shell: bash
        env:
          WEBSITE_SYNC_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
        run: |
          if [ -z "$WEBSITE_SYNC_TOKEN" ]; then
            echo "::warning::WEBSITE_SYNC_TOKEN is missing, so the website manifest sync could not be triggered."
            exit 0
          fi

          http_code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $WEBSITE_SYNC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/drachescript/spicychat-qol-website/dispatches \
            -d '{"event_type":"android-release"}')"

          if [ "$http_code" = "204" ]; then
            echo "Website Android manifest sync triggered successfully."
            exit 0
          fi

          echo "::warning::Website manifest dispatch returned HTTP $http_code. The website's scheduled sync remains the fallback."
          cat /tmp/dispatch-response.txt || true
          exit 0
