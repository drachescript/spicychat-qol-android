name: Android Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout Android
        uses: actions/checkout@v4

      - name: Checkout SpicyChat QoL extension
        uses: actions/checkout@v4
        with:
          repository: drachescript/spicychat-qol-extension
          ref: main
          path: spicychat-qol-extension

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter environment
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Sync current extension into Android assets
        shell: pwsh
        run: |
          .\update_android.ps1 `
            -SourceRoot "$env:GITHUB_WORKSPACE\spicychat-qol-extension"

      - name: Flutter dependencies
        working-directory: android_app
        shell: pwsh
        run: flutter pub get

      - name: Flutter analyze
        working-directory: android_app
        shell: pwsh
        run: flutter analyze

      - name: Validate Android bridge JavaScript
        shell: pwsh
        run: |
          node --check android_app/assets/js/bridge.js
          node --check android_app/assets/options/options-bridge.js
          node --check android_app/assets/js/android-message-longpress.js
